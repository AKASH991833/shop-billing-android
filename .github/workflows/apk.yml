name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding
        run: |
          flutter create . --platforms android --project-name shop_billing
          rm -f test/widget_test.dart
      - name: Apply brand config
        env:
          BRAND_JSON: ${{ secrets.BRAND_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, re
          s = os.environ.get("BRAND_JSON", "").strip()
          if s:
              open("assets/brand.json", "w").write(s)
              name = json.loads(s).get("shop_name", "").strip()
              if name:
                  m = "android/app/src/main/AndroidManifest.xml"
                  x = open(m).read()
                  x = re.sub(r'android:label="[^"]*"', 'android:label="%s"' % name, x)
                  open(m, "w").write(x)
          PY
      - run: flutter pub get
      - name: Data-layer tests (deposits, payments, returns, restart persistence)
        run: flutter test test/appdb_test.dart
      - name: Visual screen renders (Flutter software rasterizer, NOT Android execution)
        run: timeout 600 flutter test test/golden_screens_test.dart --update-goldens
      - name: Functional UI flow test (VM widget test, no emulator)
        continue-on-error: true
        run: timeout 300 flutter test test/app_flow_vm_test.dart -r expanded
      - name: Build release APKs (runs even if the VM flow test above failed - check step outcomes, not just the run badge)
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-golden-renders
          path: test/goldens/*.png
