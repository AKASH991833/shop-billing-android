name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding
        run: |
          flutter create . --platforms android --project-name shop_billing
          rm -f test/widget_test.dart
      - name: Apply brand config
        env:
          BRAND_JSON: ${{ secrets.BRAND_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, re
          s = os.environ.get("BRAND_JSON", "").strip()
          if s:
              open("assets/brand.json", "w").write(s)
              name = json.loads(s).get("shop_name", "").strip()
              if name:
                  m = "android/app/src/main/AndroidManifest.xml"
                  x = open(m).read()
                  x = re.sub(r'android:label="[^"]*"', 'android:label="%s"' % name, x)
                  open(m, "w").write(x)
          PY
      - run: flutter pub get
      - name: Data-layer tests (deposits, payments, returns, restart persistence, PDF render)
        run: flutter test test/appdb_test.dart test/invoice_totals_test.dart test/newbill_totals_test.dart test/invoice_pdf_test.dart test/records_csv_test.dart test/applock_test.dart
      - name: Visual screen renders (Flutter software rasterizer, NOT Android execution)
        continue-on-error: true
        run: timeout 600 flutter test test/golden_screens_test.dart --update-goldens
      - name: Functional UI flow test (VM widget test, no emulator)
        continue-on-error: true
        run: timeout 300 flutter test test/app_flow_vm_test.dart -r expanded
      - name: Build release APKs (runs even if a test step above failed - check step outcomes, not just the run badge)
        if: always()
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-sample-pdf
          path: build/invoice-sample*.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-golden-renders
          path: test/goldens/*.png
      # --- Android-runtime smoke (bounded attempt, materially corrected vs
      # runs 4-7: KVM enabled (run 4 had -accel off, 6.5-min boot) and
      # libpulse0 installed (run 7: qemu could not even load). Stop and
      # preserve evidence on the same boot/GPU/timeout failures.
      - name: Enable KVM (run 4 booted with -accel off)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: "Emulator runtime deps (run 7 fix: install qemu libpulse.so.0 dependency)"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpulse0 libglu1-mesa libxcb-cursor0
      - name: Emulator smoke test (real Android runtime; bounded, evidence preserved)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          emulator-options: -no-window -no-snapshot-save -noaudio -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          script: bash .github/scripts/run_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: |
            boot_home.png
            lock_after_home.png
            lock_after_unlock.png
            logcat_tail.txt
            smoke_run.log
            state_home.png
            state_more.png
            state_lockgate.png
            state_unlocked.png
          if-no-files-found: ignore
